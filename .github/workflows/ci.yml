name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux-checks:
    name: Linux Tests & Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux audio and GTK/WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Tests (Core, LAME, Desktop)
        run: cargo test --workspace --verbose

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Verify Node.js version
        run: |
          node -v
          npm -v

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify i18n Key Parity (en / id)
        run: npm run test:i18n

      - name: Svelte Check
        run: npm run check

      - name: Build Frontend
        run: npm run build

  windows-build:
    name: Windows Build & NSIS Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Vendored LAME DLL (MSVC)
        shell: pwsh
        run: |
          ./scripts/build-lame-dll.ps1
          if (-not (Test-Path "src-tauri\windows\libmp3lame.dll")) {
            Copy-Item "target\lame-dist\libmp3lame.dll" "src-tauri\windows\libmp3lame.dll" -Force
          }

      - name: Run Workspace Tests on Windows
        run: cargo test --workspace

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Verify Node.js version
        run: |
          node -v
          npm -v

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Desktop Installer (NSIS)
        run: npm run tauri build

      - name: Upload NSIS Installer & LAME Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: streamy-desktop-windows-x64
          path: |
            **/bundle/nsis/*.exe
            **/libmp3lame.dll
            crates/streamy-lame/lame_notice.txt
