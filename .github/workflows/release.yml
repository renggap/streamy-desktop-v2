name: Release

# Push a tag like `v2.1` (made by `npm run release -- 2.1`) to build the signed
# Windows installer and publish it, with the updater's latest.json, as a
# GitHub Release. Installed apps pick it up automatically.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-release:
    name: Build & publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $parts = $version.Split('.')
          $expected = "v$($parts[0]).$($parts[1])"
          if ("${{ github.ref_name }}" -ne $expected) {
            Write-Error "Tag ${{ github.ref_name }} does not match app version $version (expected $expected). Use: npm run release -- <major.minor>"
            exit 1
          }

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Vendored LAME DLL (MSVC)
        shell: pwsh
        run: |
          ./scripts/build-lame-dll.ps1
          if (-not (Test-Path "src-tauri\windows\libmp3lame.dll")) {
            Copy-Item "target\lame-dist\libmp3lame.dll" "src-tauri\windows\libmp3lame.dll" -Force
          }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Streamy Desktop ${{ github.ref_name }}
          releaseBody: See the commits since the previous release for what changed.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
