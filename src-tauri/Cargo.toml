[package]
name = "streamy-desktop"
version = "2.0.0"
description = "Streamy Desktop Windows App"
authors = ["Streamy Authors"]
edition = "2021"

[lib]
name = "streamy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
streamy-core = { path = "../crates/streamy-core" }
streamy-lame = { path = "../crates/streamy-lame" }
tauri = { version = "2.2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2.2"
tauri-plugin-autostart = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
cpal = "0.15"
rubato = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
parking_lot = "0.12"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }
keyring = { version = "3.3", features = ["windows-native"] }

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3.3", features = [] }

[dev-dependencies]
tempfile = "3.10"
