[package]
name = "streamy-core"
version = "2.0.0"
edition = "2021"
authors = ["Streamy Authors"]
license = "MIT"
description = "Platform-neutral core for Streamy Desktop (Ultravox, Icecast, audio pipeline, sessions)"

[dependencies]
streamy-lame = { path = "../streamy-lame" }
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
rand = "0.9"
base64 = "0.22"
thiserror = "2.0"
tracing = "0.1"
rubato = "0.16"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.17"
